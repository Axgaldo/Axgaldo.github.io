name: CI

# Pruebas en pull requests y pushes a ramas que no son main.
# El push a main lo cubre deploy.yml (prueba antes de desplegar).

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
