<!doctype html>
<html lang="es" data-phosphor="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AxGaldo · Lobby CRT</title>
  <meta name="description" content="Lobby tipo consola CRT con todas las GitHub Pages de AxGaldo (Antonio Galdó Seiquer).">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <h1 class="sr-only">AxGaldo — lobby de GitHub Pages</h1>

  <main class="stage">
    <!-- Monitor CRT: pantalla abombada + consola que se escribe sola -->
    <section class="monitor" aria-label="Consola CRT">
      <div class="screen">
        <div class="console" id="console">
          <noscript>
            <p class="noscript">
              Este lobby necesita JavaScript.<br>
              Puedes ver mis páginas en
              <a href="https://github.com/AxGaldo?tab=repositories">github.com/AxGaldo</a>.
            </p>
          </noscript>
          <div id="console-boot"></div>
          <div id="console-project"></div>
        </div>
        <!-- Reloj en vivo, esquina superior derecha del tubo -->
        <div class="clock" id="clock" aria-hidden="true"></div>
        <!-- Mascota: Vault Boy (pulgar arriba) recortado como máscara al
             color del fósforo, fija en la esquina inferior derecha -->
        <div class="mascot" aria-hidden="true">
          <div class="mascot-art"></div>
        </div>
        <div class="fx fx-scanlines" aria-hidden="true"></div>
        <div class="fx fx-sweep" aria-hidden="true"></div>
        <div class="fx fx-glare" aria-hidden="true"></div>
        <div class="fx fx-vignette" aria-hidden="true"></div>
      </div>

      <div class="bezel-bar">
        <span class="brand">AXGALDO · CRT-88</span>
        <div class="controls">
          <span class="led" aria-hidden="true"></span>
          <button id="about-btn" class="bezel-btn" type="button"
                  title="Escribir mi bio en la consola">SOBRE MÍ</button>
          <button id="sound-btn" class="bezel-btn" type="button" aria-pressed="true"
                  title="Sonido de teletipo (encendido / muteado)">SONIDO</button>
          <button id="phosphor-btn" class="bezel-btn" type="button" aria-pressed="true"
                  title="Cambiar fósforo (verde / blanco)">FÓSFORO</button>
        </div>
        <a class="license" href="https://github.com/AxGaldo/Axgaldo.github.io"
           target="_blank" rel="noopener noreferrer">MIT</a>
      </div>
    </section>

    <!-- Carrusel: pila vertical 3D en escritorio, tira horizontal con flechas en móvil -->
    <aside class="carousel-wrap" aria-label="Proyectos">
      <button id="carousel-prev" class="arrow arrow-prev" type="button" aria-label="Proyecto anterior">‹</button>
      <div class="carousel" id="carousel"></div>
      <button id="carousel-next" class="arrow arrow-next" type="button" aria-label="Proyecto siguiente">›</button>
    </aside>
  </main>

  <!-- Espejo accesible: el texto se anuncia completo al terminar de escribirse -->
  <p class="sr-only" id="sr-console" aria-live="polite"></p>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
