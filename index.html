<!doctype html>
<html lang="es" data-phosphor="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AxGaldo · Lobby CRT</title>
  <meta name="description" content="Lobby tipo consola CRT con todas las GitHub Pages de AxGaldo (Antonio Galdó Seiquer).">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <h1 class="sr-only">AxGaldo — lobby de GitHub Pages</h1>

  <main class="stage">
    <!-- Monitor CRT: pantalla abombada + consola que se escribe sola -->
    <section class="monitor" aria-label="Consola CRT">
      <div class="screen">
        <div class="console" id="console">
          <noscript>
            <p class="noscript">
              Este lobby necesita JavaScript.<br>
              Puedes ver mis páginas en
              <a href="https://github.com/AxGaldo?tab=repositories">github.com/AxGaldo</a>.
            </p>
          </noscript>
          <div id="console-boot"></div>
          <div id="console-project"></div>
        </div>
        <!-- Mascota: Vault Boy estilizado con pulgar arriba, fijo abajo
             a la derecha del tubo -->
        <div class="mascot" aria-hidden="true">
          <svg viewBox="0 0 220 230" xmlns="http://www.w3.org/2000/svg" role="img">
              <g fill="none" stroke="currentColor" stroke-width="4"
                 stroke-linecap="round" stroke-linejoin="round">
                <!-- cabeza -->
                <ellipse cx="120" cy="72" rx="56" ry="52"/>
                <!-- mechón -->
                <path d="M88 26 C 92 10 112 4 128 10 C 118 10 110 16 107 24
                         C 114 18 124 19 130 25 C 124 31 112 32 105 30
                         C 98 34 91 32 88 26 Z"/>
                <!-- cejas -->
                <path d="M88 60 C 94 54 104 53 111 58"/>
                <path d="M129 57 C 136 53 145 54 151 60"/>
                <!-- guiño -->
                <path d="M92 72 l9 7 l9 -7"/>
                <circle cx="141" cy="75" r="5"/>
                <!-- nariz y sonrisa -->
                <path d="M117 84 q5 7 -3 9"/>
                <path d="M86 96 C 98 118 142 118 154 96"/>
                <path d="M86 96 C 98 106 142 106 154 96"/>
                <!-- orejas -->
                <path d="M64 66 q-10 6 -6 16 q4 8 12 8"/>
                <path d="M176 66 q10 6 6 16 q-4 8 -12 8"/>
                <!-- cuello y cuello del mono -->
                <path d="M106 124 v12"/>
                <path d="M134 124 v12"/>
                <path d="M106 136 L120 150 L134 136"/>
                <!-- torso del mono de trabajo -->
                <path d="M106 136 C 94 140 87 148 86 158 L 82 200
                         C 81 208 86 214 94 214 L146 214
                         C 154 214 159 208 158 200 L154 158
                         C 153 148 146 140 134 136"/>
                <path d="M120 150 V214"/>
                <text x="120" y="196" text-anchor="middle" font-size="22"
                      fill="currentColor" stroke="none">111</text>
                <!-- brazo izquierdo, abajo -->
                <path d="M152 150 C 164 158 170 170 172 186 L176 210"/>
                <circle cx="178" cy="218" r="8"/>
                <!-- brazo derecho, pulgar arriba -->
                <path d="M94 148 C 84 150 76 158 70 168"/>
                <path d="M70 168 C 64 158 58 150 56 140"/>
                <circle cx="56" cy="132" r="10"/>
                <path d="M51 122 Q 44 110 47 98"/>
              </g>
            </svg>
          </div>
        </div>
        <div class="fx fx-scanlines" aria-hidden="true"></div>
        <div class="fx fx-sweep" aria-hidden="true"></div>
        <div class="fx fx-glare" aria-hidden="true"></div>
        <div class="fx fx-vignette" aria-hidden="true"></div>
      </div>

      <div class="bezel-bar">
        <span class="brand">AXGALDO · CRT-88</span>
        <div class="controls">
          <span class="led" aria-hidden="true"></span>
          <button id="phosphor-btn" class="bezel-btn" type="button" aria-pressed="false"
                  title="Cambiar fósforo (blanco / verde)">FÓSFORO</button>
        </div>
        <a class="license" href="https://github.com/AxGaldo/Axgaldo.github.io"
           target="_blank" rel="noopener noreferrer">MIT</a>
      </div>
    </section>

    <!-- Carrusel: pila vertical 3D en escritorio, tira horizontal con flechas en móvil -->
    <aside class="carousel-wrap" aria-label="Proyectos">
      <button id="carousel-prev" class="arrow arrow-prev" type="button" aria-label="Proyecto anterior">‹</button>
      <div class="carousel" id="carousel"></div>
      <button id="carousel-next" class="arrow arrow-next" type="button" aria-label="Proyecto siguiente">›</button>
    </aside>
  </main>

  <!-- Espejo accesible: el texto se anuncia completo al terminar de escribirse -->
  <p class="sr-only" id="sr-console" aria-live="polite"></p>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
